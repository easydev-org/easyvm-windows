name: windows10-ssh

# THE WINDOWS 10 SSH STAGE: boot `windows10`, install OpenSSH, and prove a remote shell reaches it.
#
# ONE WORKFLOW FILE PER FAMILY, ZERO MATRIX - the same rule the install legs follow. This file names
# its own disk and publishes its own tag, so a dispatch runs exactly one family and nothing else can
# affect it.
#
# IT IS A COPY OF `windows-ssh.yml` WITH THE FAMILY'S OWN NAMES, and the walks behind them are
# identical apart from their titles and their `reference/desktop.png`. That is deliberate: after the
# `-cpu`/`-smp` fix every step is a plain Windows operation, and the families differ in what they
# ship rather than in how `winget` or `Set-Service` behaves.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-windows"
      from_tag:
        description: >-
          the PUBLISHED disk this stage continues from (default windows10)
        default: "windows10"

concurrency:
  group: windows10-ssh
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  ssh:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "25"
      group: windows10-ssh
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "windows10-ssh",
            "file": "10/steps/ssh.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "windows10-ssh.qcow2",
            "publish": "windows10-ssh",
            "timeout": 70
          }
        ]
