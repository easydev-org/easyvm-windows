name: windows-install

# INSTALL ANY OF THIS REPOSITORY'S WINDOWS FAMILIES ONTO A DISK THIS STAGE MAKES, AND PUBLISH IT.
#
# FOUR FAMILIES, ONE FILE, AS A MATRIX OF THE CALLED JOB. Each row carries the three facts that differ
# between them - which walk directory, which medium, which answer CD - plus the published tag and the
# budget. THAT IS THE WHOLE DIFFERENCE: the boot arguments, the disk layout, the desktop check and the
# shutdown are shared, because they are properties of "a Windows guest" rather than of a release.
#
# WHY NOT FOUR FILES. The linux repository has one file per distribution because each has its own
# installer with its own vocabulary of screens. These four do not: Setup's windowsPE pass is the same
# program in all of them, and what differs is DATA - a product key, an image selector, whether the TPM
# bypasses apply. Data belongs in a matrix row. A fourth copy of a 389-line walkthrough would be a
# fourth place for the quit-dialog fix to be missing from, and that fix was found by watching a
# fifty-minute recording.
#
# EVERY ROW STARTS FROM AN EMPTY DISK (`pull: ""`), which is what an install is. A later stage
# continues from a published tag and lives in its own workflow.
#
# THE ANSWER CD IS PER FAMILY, BUILT BY artifacts-publish.yml FROM THE MEDIUM ITSELF. `answer-windows11`
# predates this file; the other three are new tags, and the publish job builds one per medium because a
# product key and an image selector are facts about a release - see scripts/build-answer.sh.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks and media"
        default: "easydev-org/easyvm-windows"

# ONE GROUP FOR THE WHOLE MATRIX, because two runs of the same matrix would publish the same four tags
# and the second would be refused by `oci-push` for identical bytes. A single family re-run is
# `gh run rerun --job`, which reuses this group.
concurrency:
  group: windows-install
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    # A MATRIX ON A JOB THAT CALLS A REUSABLE WORKFLOW IS THE ONLY WAY TO VARY WHAT IT IS CALLED WITH,
    # because the caller's `with:` is evaluated once per matrix row. `fail-fast: false` IS THE POINT:
    # a Server install that stops on a question the walk does not know must not cancel the other three.
    strategy:
      fail-fast: false
      matrix:
        include:
          # `dir` is the walk directory; `timeout` is the stage's own budget in minutes. WINDOWS 10 IS
          # BUDGETED LOWER THAN 11 because its Setup has no TPM/Secure Boot pages and no OOBE account
          # flow - measured on the 11 install, which spends most of its hour after the image is applied.
          - { family: "win11",         dir: "11",   iso: "iso-windows11",      answer: "answer-windows11",      tag: "windows11",         timeout: 175 }
          - { family: "win10",         dir: "10",   iso: "iso-win10",          answer: "answer-win10",          tag: "windows10",         timeout: 150 }
          - { family: "win11iot-ltsc", dir: "ltsc", iso: "iso-win11iot-ltsc",  answer: "answer-win11iot-ltsc",  tag: "windows11iot-ltsc", timeout: 175 }
          - { family: "win2025",       dir: "2025", iso: "iso-win2025",        answer: "answer-win2025",        tag: "windows2025",       timeout: 175 }
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.3-dev
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.3-dev
      group: windows-install-${{ matrix.family }}
      disks_repository: ${{ inputs.disks_repository }}
      # A 40 GiB DISK FOR SERVER, 25 FOR THE CLIENTS. Windows Server 2025's own requirement is 32 GiB
      # of disk, and a 25 GiB target fails during the image apply with an error that names the volume
      # rather than the budget.
      disk_gb: ${{ matrix.family == 'win2025' && '40' || '25' }}
      stages: |
        [
          {
            "name": "windows-${{ matrix.family }}-install",
            "file": "${{ matrix.dir }}/steps/install.walk",
            "pull": "",
            "assets": ["${{ matrix.iso }}:windows.iso.tar", "iso-virtio-win:virtio-win.iso.tar", "${{ matrix.answer }}:answer.iso.tar"],
            "out": "${{ matrix.tag }}.qcow2",
            "publish": "${{ matrix.tag }}",
            "timeout": ${{ matrix.timeout }}
          }
        ]
