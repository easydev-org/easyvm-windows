name: artifacts-publish

# THE PINNED INPUTS THIS REPOSITORY'S STAGES FETCH, MIRRORED INTO ITS OWN PACKAGE.
#
# SPLIT OUT OF easydev-org/easyvm, WHICH MIRRORED EVERY OPERATING SYSTEM'S ASSETS INTO ONE PACKAGE.
# That worked while every stage lived in one repository; it stopped being right the day they did not.
# A package a repository PUSHES to is the package its own token can write, and an asset layer with one
# place to look per operating system is one where a wrong tag names the repository that is wrong.
#
# WHY MIRROR AT ALL: the vendors serve these at a fraction of ghcr's rate - SourceForge answered
# BlissOS at 0.5 MB/s on the measurement that produced the pin, and a CI run was cancelled at exactly
# 1h0m0s with the ISO at 92%. The same bytes from ghcr arrive in about a minute.

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which group to publish"
        type: choice
        options:
          - all
          - windows
        default: all
      disks_repository:
        description: >-
          The ghcr package the pinned inputs are MIRRORED INTO. Empty means THIS repository, which is
          what every caller wants: a token can only write to the package its own repository holds.
        default: ""
      which:
        description: "One exact tag, overriding `group`. Empty publishes the whole group."
        default: ""
      keep:
        description: "Keep the downloaded files on the runner"
        type: boolean
        default: false

concurrency:
  group: artifacts-publish-${{ github.ref }}-${{ inputs.which }}-${{ inputs.group }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - { tag: "iso-windows11", group: "windows", url: "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26200.6584.250915-1905.25h2_ge_release_svc_refresh_CLIENT_CONSUMER_x64FRE_en-us.iso", sha: "d141f6030fed50f75e2b03e1eb2e53646c4b21e5386047cb860af5223f102a32", size: "7736125440" }
          - { tag: "iso-virtio-win", group: "windows", url: "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso", sha: "", size: "0" }
          # THE THREE WINDOWS MEDIA THE ANSWER JOB'S OTHER ROWS READ.
          #
          # EACH IS A `go.microsoft.com/fwlink` RATHER THAN A DATED CDN PATH, AND THAT IS A MEASURED
          # CHOICE: the two client ISOs above are pinned to a build string
          # (`26200.6584.250915-1905.25h2_ge_release_...`), which stops existing when Microsoft
          # refreshes it. The Evaluation Center's links are stable REDIRECTS - the filename behind
          # them changes with each refresh, so their digests cannot be pinned, and their LENGTH is
          # checked instead. `mirror-one.sh` follows redirects and checks whatever length is written
          # here, which is the same contract `iso-virtio-win` already has with `size: "0"`.
          #
          # THE SIZES ARE MEASURED, not copied: each was the `Content-Length` the redirect served on
          # 2026-11-23, and a length that disagrees is a refused push rather than a warning.
          # WINDOWS 10 HAS NO STABLE FILE LINK AND THAT IS WHY IT CARRIES `resolve:` INSTEAD OF
          # `url:`. Its public page stopped serving an ISO to Windows visitors in 2025-10, and the
          # connector's answer is a SIGNED URL that expires in a day (`?t=...&P1=<unix time>`) - so a
          # literal one in this file is a dead link for every run after tomorrow. MEASURED: the
          # connector answered
          #
          #	https://software.download.prss.microsoft.com/dbazure/Win10_22H2_English_x64v1.iso
          #	  ?t=67fc0410-...&P1=1795536030&...
          #
          # and 1795536030 is 2026-11-24T16:00:30Z. `scripts/fetch-windows-iso.py` makes the four
          # requests that page made, every time, so the URL is minted in the job that uses it.
          - { tag: "iso-win10",         group: "windows", resolve: "win10", sha: "", size: "6140975104" }
          - { tag: "iso-win11iot-ltsc", group: "windows", url: "https://go.microsoft.com/fwlink/?linkid=2270353&clcid=0x409&culture=en-us&country=us", sha: "", size: "5060020224" }
          - { tag: "iso-win2025",       group: "windows", url: "https://go.microsoft.com/fwlink/?linkid=2345730&clcid=0x409&culture=en-us&country=us", sha: "", size: "8152356864" }
    # NO `if:` HERE, AND THAT IS NOT AN OVERSIGHT: A JOB-LEVEL `if:` CANNOT SEE `matrix`.
    #
    # GitHub evaluates a job's `if:` before the matrix is expanded, so `matrix.artifact.tag` is empty
    # there and the condition silently reads as false for every row - a run with zero jobs and no log
    # line. MEASURED, and it is what the repository's own workflow test refuses.
    #
    # SELECTION GOES IN THE MATRIX INSTEAD, which IS evaluated per row. The generator that wrote this
    # file reads the catalogue and the three inputs, so a re-run of one artifact is:
    #
    #	gh workflow run artifacts-publish.yml -f tag=iso-windows11
    #
    # and the matrix then holds one row. The cost is that the row list is written out at generation
    # time rather than computed at run time - which a catalogue in a heredoc was already doing.
    steps:
      - uses: actions/checkout@v4

      # A ROW THAT WAS NOT ASKED FOR EXITS BEFORE IT DOWNLOADS ANYTHING.
      #
      # THE COMMENT ABOVE THIS JOB USED TO SAY A RE-RUN OF ONE ARTIFACT WAS `-f which=iso-windows11`
      # "because the matrix then holds one row". IT DID NOT: the matrix is a literal list written
      # into this file, nothing reads `which` or `group`, and `-f which=iso-freebsd` started
      # SEVENTEEN DOWNLOADS AND FIFTY-ONE GIBABYTES - measured on run 44298764450, cancelled after
      # the jobs came up. A selection input that is declared and never read is worse than none: it
      # reads like a filter and behaves like "everything".
      #
      # THE GUARD IS A STEP RATHER THAN A JOB `if:` FOR THE REASON THE COMMENT BELOW ALREADY GIVES:
      # GitHub evaluates a job's `if:` BEFORE the matrix is expanded, so `matrix.artifact.tag` is
      # empty there and every row would read as false.
      - name: is this row wanted
        id: wanted
        env:
          WHICH: ${{ inputs.which }}
          GROUP_INPUT: ${{ inputs.group }}
          ROW_TAG: ${{ matrix.artifact.tag }}
          ROW_GROUP: ${{ matrix.artifact.group }}
        run: |
          set -eu
          if [ -n "${WHICH:-}" ]; then
            if [ "$ROW_TAG" = "$WHICH" ]; then
              echo "wanted=yes" >> "$GITHUB_OUTPUT"
            else
              echo "wanted=no" >> "$GITHUB_OUTPUT"
              echo "skipped: asked for $WHICH, this row is $ROW_TAG"
            fi
            exit 0
          fi
          if [ "${GROUP_INPUT:-all}" = "all" ] || [ "$ROW_GROUP" = "$GROUP_INPUT" ]; then
            echo "wanted=yes" >> "$GITHUB_OUTPUT"
          else
            echo "wanted=no" >> "$GITHUB_OUTPUT"
            echo "skipped: asked for group $GROUP_INPUT, this row is $ROW_GROUP"
          fi

      - name: prepare the runner
        if: steps.wanted.outputs.wanted == 'yes'
        # THE DISK IS THE POINT: the largest single input is 7.7 GiB and its hash pass reads it again,
        # so a runner with a 14 GiB volume fails halfway through the Windows image.
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: false
          disk-gb: '25'
          token: ${{ github.token }}

      - name: mint the URL, when the row names a resolver instead of a link
        if: steps.wanted.outputs.wanted == 'yes'
        # A ROW EITHER HAS A `url:` OR A `resolve:`, NEVER BOTH, and this step is the second kind. The
        # resolver is a Python script because Windows 10's page needs a session, an anti-bot token, a
        # SKU lookup and a redirect - four requests that a `curl` line cannot express, and whose result
        # expires in a day so it cannot be written into this file at all.
        #
        # THE DIGEST IS STILL NOT PINNED for these rows and the reason is in the row's comment: the
        # filename behind the link changes at each refresh. The LENGTH is the check, and it is exact.
        id: mint
        env:
          RESOLVE: ${{ matrix.artifact.resolve }}
        run: |
          set -eu
          if [ -z "${RESOLVE:-}" ]; then
            echo "url=${{ matrix.artifact.url }}" >> "$GITHUB_OUTPUT"
            echo "this row has a literal url; nothing to mint"
            exit 0
          fi
          case "$RESOLVE" in
            win10|win11|win11iot-ltsc|win2025) ;;
            *) echo "::error::$RESOLVE is not a name fetch-windows-iso.py knows"; exit 1 ;;
          esac
          # THE ARCH IS x64 FOR EVERY ROW THIS REPOSITORY PUBLISHES. An ARM64 medium is a second
          # machine shape (`qemu-system-aarch64`, AAVMF, `virtio-blk-device`) and the engine spawns
          # `qemu-system-x86_64` by name - see docs/WINDOWS-VERSIONS.md. Adding an ARM64 row here
          # without that shape would publish an ISO no stage can boot.
          url=$(python3 scripts/fetch-windows-iso.py "$RESOLVE" x64)
          case "$url" in
            https://*) ;;
            *) echo "::error::the resolver answered something that is not a URL: $url"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "=== minted a $(printf '%s' "$url" | sed -E 's/[?].*//' | sed 's|.*/||') URL"

      - name: download and verify
        if: steps.wanted.outputs.wanted == 'yes'
        # THE PER-ARTIFACT RULE LIVES IN ONE SCRIPT, because it is fifteen comments long and a matrix
        # row should be readable. It downloads, checks the pin by ITS OWN LENGTH, and fails with the
        # numbers when they differ.
        id: fetch
        env:
          GROUP: ${{ matrix.artifact.group }}
          # EMPTY HERE IS NOT "NO OPINION": `internal/asset` falls back to `easydev-org/easyvm` when
          # this is unset, which is the product's package and not writable with this token. So the
          # default is spelled out as this repository rather than left to the fallback.
          DISKS_REPOSITORY: ${{ inputs.disks_repository || github.repository }}
        run: |
          set -eu
          path=$(sh scripts/mirror-one.sh \
                   "${{ matrix.artifact.tag }}" \
                   "${{ steps.mint.outputs.url }}" \
                   "${{ matrix.artifact.sha }}" \
                   "${{ matrix.artifact.size }}")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: pack into a tar
        if: steps.wanted.outputs.wanted == 'yes'
        # EVERY PUBLISHED ASSET IS ONE TAR, AND THIS IS WHERE THAT STARTS.
        #
        # A LEG HAS ONE WAY TO PREPARE ITS WORK DIRECTORY: pull the named artifact, unpack it, delete
        # the archive. That is what removed `fetch:` from the engine - the step that used to know a
        # firmware was three files, or that an answer CD was assembled from an ISO, now knows nothing
        # and the archive says it instead.
        run: |
          set -eu
          src="${{ steps.fetch.outputs.path }}"
          dir=$(dirname "$src")
          base=$(basename "$src")
          case "$base" in
            *.tar) echo "already a tar: $src" ;;
            *)
              tar -cf "$dir/$base.tar" -C "$dir" "$base"
              rm -f "$src"
              echo "path=$dir/$base.tar" >> "$GITHUB_OUTPUT"
              ;;
          esac
        id: pack

      - name: push
        if: steps.wanted.outputs.wanted == 'yes'
        # THE TRANSFER IS THE ACTION THAT KNOWS THE REGISTRY: it installs oras idempotently, logs in
        # explicitly, and refuses a push whose bytes are identical to an earlier artifact.
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: ${{ steps.pack.outputs.path }}
          tag: ${{ matrix.artifact.tag }}
          repository: ${{ inputs.disks_repository || github.repository }}
          media-type: application/vnd.easydev.artifact
          token: ${{ github.token }}
          check-name: mirror-${{ matrix.artifact.tag }}

  # APPLE'S RECOVERY IMAGE IS THE ONE INPUT THAT CANNOT BE A CATALOGUE ROW.
  #
  # Every other upstream here is one HTTP GET. This one is a session cookie, a five-field POST with
  # opaque nonces, a token exchange, and then a CDN download that has to be parallel or it is cut
  # short - Apple does not serve it as one request:
  #
  #	curl: (18) end of response with 887566699 bytes missing
  #
  # and every request produces a DIFFERENT URL AND TOKEN, so there is nothing stable to pin.
  #
  # SO IT IS A TRANSFER BETWEEN TWO PACKAGES RATHER THAN A DOWNLOAD: the file is the same bytes, one
  # copy is already published under `macos-recovery-<name>`, and this mirrors it into THIS
  # repository's package so the asset layer has one place to look. A pull and a push, both through the
  # organisation's actions.
  #
  # ONE ROW PER macOS RELEASE, AND `tahoe` WAS MISSING FROM THIS JOB. `internal/asset` has resolved
  # release 26 to the tag `macos-recovery-tahoe` since that table was written, and the publisher had
  # only ever mirrored `sequoia` - so the image a 26 stage requires was in `easydiskbake` and in no
  # repository this build reads. The failure mode of the omission is the one this project keeps
  # paying for: a 404 in somebody's first step, naming a tag that looks like a typo.
  #
  # THE SOURCE IS THE PUBLISHER'S OWN PACKAGE for both rows. `sequoia` was mirrored from THIS
  # repository before (it had been copied here once by hand); pulling both from `easydiskbake` makes
  # the two rows the same shape and leaves one origin for every Apple image.

  # THE ANSWER CD A WINDOWS GUEST BOOTS WITH, BUILT HERE INSTEAD OF IN EVERY STAGE.
  #
  # IT USED TO BE A `fetch: answer_iso` STEP INSIDE `easyvm run`, which meant the engine carried an
  # ISO9660 writer (internal/answer, 315 lines) and a driver extractor, and every Windows stage paid
  # for a build whose inputs never change:
  #
  #	user      vmuser     the walk's own default
  #	password  admin      the walk's own default
  #	computer  sandbox    the walk's own default
  #
  # THE IMAGE SELECTOR IS NOT IN THAT LIST, AND IT USED TO BE. It was `image 6`, and 6 is true of ONE
  # MEDIUM. MEASURED across the four this repository now publishes:
  #
  #	Windows 11 consumer          index 6 is Professional
  #	Windows 11 IoT LTSC eval     6 is OUT OF RANGE - the medium carries one or two images
  #	Windows Server 2025 eval     the medium NAMES its images instead of numbering them
  #
  # so the selector is read from the medium being installed and the answer file carries the OTHER
  # kind of selector for Server. `scripts/build-answer.sh` does both, and prints the table it read.
  #
  # THE IDENTITY IS SHARED ON PURPOSE, which is the same call macOS's firmware build made: a guest's
  # identity is a fact about the IMAGE, not about a run. A published disk whose password changes per
  # run cannot be re-opened by the stage after it, and that is the whole point of publishing one.
  #
  # THE SAME OUTPUT AS THE ENGINE'S BUILDER, VERIFIED: scripts/build-answer.py and the Go code produce
  # a byte-identical tree - 24 files, `diff -r` clean - for the same template and virtio-win ISO.
  #
  # ONE ROW PER FAMILY, AND THE TAG NAMES THE GUEST. `answer-windows11` is what the 11 walks pull and
  # the name that already exists; the other three are new tags, one per medium, because an answer
  # file carries a product key and an image index - two facts that belong to a release.
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      checks: write
    # A `which:` THAT NAMES AN ANSWER TAG RUNS ONLY THAT ROW, the same contract the ISO rows have.
    # MEASURED: without this, `-f which=answer-win10` published the whole group - all four answer
    # CDs, each pulling a 5-8 GiB medium - because the guard only knew the empty case.
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.group == 'all'
      || inputs.group == 'windows'
      || inputs.which == ''
      || startsWith(inputs.which, 'answer-')
    strategy:
      fail-fast: false
      matrix:
        # `family` is a row of build-answer.py's PROFILES, `tag` is the package tag, and `medium` is
        # the ISO row above whose image table is read. The three are one fact seen three ways.
        answer:
          - { family: "win11",         tag: "answer-windows11",         medium: "iso-windows11" }
          - { family: "win10",         tag: "answer-win10",             medium: "iso-win10" }
          - { family: "win11iot-ltsc", tag: "answer-win11iot-ltsc",     medium: "iso-win11iot-ltsc" }
          - { family: "win2025",       tag: "answer-win2025",           medium: "iso-win2025" }
    steps:
      - uses: actions/checkout@v4

      # A ROW THAT WAS NOT ASKED FOR EXITS BEFORE IT PULLS A FIVE-GIGABYTE MEDIUM.
      - name: is this answer row wanted
        id: wanted
        env:
          WHICH: ${{ inputs.which }}
          ROW_TAG: ${{ matrix.answer.tag }}
        run: |
          set -eu
          if [ -z "${WHICH:-}" ] || [ "${WHICH#answer-}" = "$WHICH" ]; then
            echo "wanted=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ROW_TAG" = "$WHICH" ]; then
            echo "wanted=yes" >> "$GITHUB_OUTPUT"
          else
            echo "wanted=no" >> "$GITHUB_OUTPUT"
            echo "skipped: asked for $WHICH, this row is $ROW_TAG"
          fi

      - name: the tools the build needs
        run: |
          set -eu
          sudo apt-get update -qq
          # `p7zip-full` reads the Joliet tree the drivers live in, and `xorriso` writes the ISO.
          # BOTH ARE NAMED BECAUSE THEIR ABSENCE IS A DIFFERENT FAILURE EACH TIME: a hand-written
          # Joliet reader produces 8.3 names that do not match the driver the answer file names.
          #
          # `wimtools` IS NEW AND IT IS THE POINT: the edition table is read out of the medium's own
          # install.wim with `wimlib-imagex`, so no index is ever copied from another release.
          sudo apt-get install -y -qq p7zip-full xorriso wimtools

      - name: pull the virtio-win ISO the drivers come from
        if: steps.wanted.outputs.wanted == 'yes'
        # THE BUILD DOES NOT DOWNLOAD. It reads `virtio-win.iso` from its work directory and fails in
        # the first second without it, which is the rule every stage here follows.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          sh "$GITHUB_WORKSPACE/.github/pull-artifact.sh" \
            ghcr.io "${{ inputs.disks_repository || github.repository }}" \
            iso-virtio-win virtio-win.iso
          ls -l virtio-win.iso

      - name: pull the Windows medium the edition table is read from
        if: steps.wanted.outputs.wanted == 'yes'
        # THE MEDIUM IS AN INPUT TO THE ANSWER FILE, WHICH IS THE WHOLE CHANGE. It used to be only an
        # input to the INSTALL; now the image index comes out of it, so a family whose medium is absent
        # cannot produce a correct answer file and must fail here rather than at Setup.
        #
        # THE TAG NAMES THE ISO ROW, whose `description` says what file it is. `pull-artifact.sh`
        # writes it as `windows.iso` - the name a walk's `needs:` uses - so the build reads the same
        # bytes the leg will install from.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/work"
          sh "$GITHUB_WORKSPACE/.github/pull-artifact.sh" \
            ghcr.io "${{ inputs.disks_repository || github.repository }}" \
            "${{ matrix.answer.medium }}" windows.iso
          ls -l windows.iso

      - name: build the answer CD for this family, reading its image table
        if: steps.wanted.outputs.wanted == 'yes'
        # THIS IS A SHELL SCRIPT OVER TWO PYTHON ONES, AND THE SPLIT IS BY DECISION RATHER THAN BY
        # LANGUAGE:
        #
        #	scripts/wim-editions.py   READS the medium: which images it holds, by index and name
        #	scripts/build-answer.py   RENDERS one answer file from a family profile and a selector
        #	scripts/build-answer.sh   JOINS them, and prints the table it read
        #
        # The join is a script because the failure it prevents is a WRONG NUMBER, and a wrong number
        # is invisible: Setup stops on an image picker forty minutes into an install nobody watches.
        # Printing the table next to the choice is what makes the log answer "which edition" without
        # anybody re-deriving it from the ISO.
        run: |
          set -eu
          sh "$GITHUB_WORKSPACE/scripts/build-answer.sh" \
            "${{ matrix.answer.family }}" \
            "$GITHUB_WORKSPACE/work/windows.iso" \
            "$GITHUB_WORKSPACE/work/virtio-win.iso" \
            "$GITHUB_WORKSPACE/work/answer.iso"

      - name: the ISO is big enough to be an answer CD
        if: steps.wanted.outputs.wanted == 'yes'
        # A 448 KB ISO IS THE FAILURE THIS CHECK EXISTS TO AVOID: a boot record with the answer file
        # and none of the installer's drivers, which Setup accepts and then cannot see the disk with.
        run: |
          set -eu
          size=$(stat -c %s "$GITHUB_WORKSPACE/work/answer.iso")
          if [ "$size" -lt $((100 * 1024)) ]; then
            echo "::error::answer.iso is $size bytes, smaller than an ISO9660 volume with one file"
            echo "::error::and a driver tree: xorriso wrote a boot record only."
            exit 1
          fi
          ls -l "$GITHUB_WORKSPACE/work/answer.iso"

      - name: the answer file names an image that this medium has
        if: steps.wanted.outputs.wanted == 'yes'
        # THE READ-BACK THAT MAKES THE SELECTOR A CHECKED FACT RATHER THAN A VALUE SOMEBODY TYPED.
        # The ISO the build just wrote is unpacked and its `/IMAGE/INDEX` (or `/IMAGE/NAME`) is looked
        # up in the SAME table the build read - so a selector that does not resolve fails HERE, with
        # both tables printed, instead of at Setup's image picker.
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/work"
          rm -rf "$GITHUB_WORKSPACE/work/answer-check"
          mkdir -p "$GITHUB_WORKSPACE/work/answer-check"
          7z x -y -o"$GITHUB_WORKSPACE/work/answer-check" answer.iso Autounattend.xml >/dev/null
          xml="$GITHUB_WORKSPACE/work/answer-check/Autounattend.xml"
          [ -s "$xml" ] || { echo "::error::answer.iso holds no Autounattend.xml"; exit 1; }

          kind=$(grep -oE '/IMAGE/(INDEX|NAME)' "$xml" | head -1 | sed 's|/IMAGE/||')
          value=$(grep -A2 '<Key>/IMAGE/' "$xml" | grep -oE '<Value>[^<]*' | head -1 | sed 's/<Value>//')
          [ -n "$kind" ] && [ -n "$value" ] || {
            echo "::error::the answer file selects no image at all, so Setup stops on its picker"
            exit 1
          }
          echo "=== the answer file selects $kind $value"
          python3 "$GITHUB_WORKSPACE/scripts/wim-editions.py" \
            "$GITHUB_WORKSPACE/work/windows.iso"

      - name: pack the answer CD into the tar the engine unpacks
        if: steps.wanted.outputs.wanted == 'yes'
        # ONE TAG, ONE TAR, BECAUSE THE ENGINE'S `fetchAnswerISO` UNPACKS IT.
        #
        # `internal/asset/fetchAnswerISO` calls `pullTag` then `untar` and then stats
        # `<work>/answer.iso`. MEASURED on windows install, run 45107985436: this job used to push the
        # bare ISO, the engine pulled it into `answer-cd.tar`, `untar` found no member names it could
        # restore, and the stage failed with
        #
        #	answer-windows11 did not unpack answer.iso: stat .../work/answer.iso: no such file
        #
        # The macOS firmware artifact has the same shape for the same reason - `oci-push` mirrors ONE
        # file, so the file it mirrors is the archive the consumer unpacks.
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/work"
          tar -cf answer-cd.tar answer.iso
          ls -l answer-cd.tar

      - name: push the answer CD under this family's tag
        if: steps.wanted.outputs.wanted == 'yes'
        # THE TAG NAMES THE GUEST, because a product key and an image selector are facts about a
        # RELEASE. `answer-windows11` is the one the existing 11 walks pull; the three new tags are
        # what the new walks will pull.
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: ${{ github.workspace }}/work/answer-cd.tar
          tag: ${{ matrix.answer.tag }}
          repository: ${{ inputs.disks_repository || github.repository }}
          media-type: application/vnd.easydev.artifact
          token: ${{ github.token }}
          check-name: ${{ matrix.answer.tag }}

  # THE AGENT'S MSI AND ITS DRIVER, UNPACKED FROM THE virtio-win ISO AND PUBLISHED AS ONE TAR.
  #
  # THIS EXISTS BECAUSE THE ENGINE NO LONGER EXTRACTS ANYTHING. A `fetch: guest_agent_windows` step
  # used to pull the ISO and run `7z` on four members inside the walkthrough - which put "how to
  # prepare a file" in the engine, in a second place beside the leg's own `assets:`. The engine now
  # pulls a tar and unpacks it, and that is all it does; what goes in the tar is decided here.
  #
  # THE FOUR MEMBERS COME FROM ONE PLACE, AND EACH IS NAMED BY A MEASUREMENT:
  #
  #	guest-agent/qemu-ga-x86_64.msi    the agent itself
  #	vioserial/w10/amd64/vioser.inf    the driver's declaration
  #	vioserial/w10/amd64/vioser.sys    what binds the device
  #	vioserial/w10/amd64/vioser.cat    what lets Windows accept the signature
  #
  # THE .inf ALONE DECLARES A DEVICE WHOSE DRIVER IS NOWHERE, and `pnputil /add-driver` then fails
  # inside the guest with a message about the catalogue rather than about the missing file.
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      checks: write
    if: github.event_name != 'workflow_dispatch' || (inputs.which == '' && (inputs.group == 'all' || inputs.group == 'windows'))
    steps:
      - uses: actions/checkout@v4

      - name: the tools the build needs
        run: |
          set -eu
          sudo apt-get update -qq
          # `7z` reads the Joliet tree the drivers live in. A hand-written reader produces 8.3 names
          # that do not match the driver the walkthrough copies.
          sudo apt-get install -y -qq p7zip-full

      - name: pull the virtio-win ISO
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          sh "$GITHUB_WORKSPACE/.github/pull-artifact.sh" \
            ghcr.io "${{ inputs.disks_repository || github.repository }}" \
            iso-virtio-win virtio-win.iso
          ls -l virtio-win.iso

      - name: extract the agent and its driver
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/work"
          mkdir -p vioserial
          7z e -y -o. virtio-win.iso guest-agent/qemu-ga-x86_64.msi
          7z e -y -ovioserial virtio-win.iso \
            vioserial/w10/amd64/vioser.inf \
            vioserial/w10/amd64/vioser.sys \
            vioserial/w10/amd64/vioser.cat
          # 7Z EXITS ZERO WHEN A MEMBER IS ABSENT IN SOME VERSIONS, so each file is checked rather
          # than trusted - a tar of three files and a missing MSI is a guest with no agent.
          for f in qemu-ga-x86_64.msi vioserial/vioser.inf vioserial/vioser.sys vioserial/vioser.cat; do
            [ -s "$f" ] || { echo "::error::the ISO has no $f"; exit 1; }
            ls -l "$f"
          done

      - name: pack them into one tar
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/work"
          tar -cf virtio-agent.tar qemu-ga-x86_64.msi vioserial
          ls -l virtio-agent.tar

      - name: push virtio-agent
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: ${{ github.workspace }}/work/virtio-agent.tar
          tag: virtio-agent
          repository: ${{ inputs.disks_repository || github.repository }}
          media-type: application/vnd.easydev.artifact
          token: ${{ github.token }}
          check-name: virtio-agent
