name: windows11-install

# WINDOWS 11: INSTALL ONTO A DISK THIS STAGE MAKES, AND PUBLISH IT.
#
# ONE FILE PER WINDOWS FAMILY, BY REQUEST. There is no matrix, here or in any of the four siblings,
# and nothing in this file depends on another family's run: it references four tags by name
# (`iso-windows11`, `iso-virtio-win`, `answer-windows11`) and publishes one (`windows11`), so it can
# be dispatched alone, cancelled alone, and re-run alone.
#
# THE FOUR SIBLINGS ARE windows10-install.yml, windows11iot-ltsc-install.yml,
# windows11iot-ltsc-arm64-install.yml and windows2025-install.yml. Each is a copy of this shape with
# its own tags, and the DIFFERENCES ARE THE POINT rather than duplication: a family's medium, its
# answer CD (which carries a product key and an image selector) and its budget are facts about that
# family, and a file per family is where those facts are legible.
#
# THE ANSWER CD IS BUILT BY artifacts-publish.yml FROM THE MEDIUM ITSELF, so no image index is ever
# typed here - see scripts/build-answer.sh and docs/WINDOWS-VERSIONS.md.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks and media"
        default: "easydev-org/easyvm-windows"

concurrency:
  group: windows11-install
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.3-dev
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.3-dev
      disk_gb: "25"
      group: windows11-install
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "windows11-install",
            "file": "11/steps/install.walk",
            "pull": "",
            "assets": ["iso-windows11:windows.iso.tar", "iso-virtio-win:virtio-win.iso.tar", "answer-windows11:answer.iso.tar"],
            "out": "windows11.qcow2",
            "publish": "windows11",
            "timeout": 175
          }
        ]
