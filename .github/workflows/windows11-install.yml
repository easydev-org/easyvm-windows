name: windows11-install

# WINDOWS 11: INSTALL ONTO A DISK THIS STAGE MAKES, AND PUBLISH IT.
#
# ONE FILE PER WINDOWS FAMILY, BY REQUEST. There is no matrix, here or in any of the four siblings,
# and nothing in this file depends on another family's run: it references four tags by name
# (`iso-windows11`, `iso-virtio-win`, `answer-windows11`) and publishes one (`windows11`), so it can
# be dispatched alone, cancelled alone, and re-run alone.
#
# THE SIBLINGS ARE windows10-install.yml and windows11iot-ltsc-install.yml. Each is a copy of this shape with
# its own tags, and the DIFFERENCES ARE THE POINT rather than duplication: a family's medium, its
# answer CD (which carries a product key and an image selector) and its budget are facts about that
# family, and a file per family is where those facts are legible.
#
# THE ANSWER CD IS BUILT BY artifacts-publish.yml FROM THE MEDIUM ITSELF, so no image index is ever
# typed here - see scripts/build-answer.sh and docs/WINDOWS-VERSIONS.md.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks and media"
        default: "easydev-org/easyvm-windows"
      # THE ENGINE THIS LEG RUNS INSIDE, OVERRIDABLE SO A FIX CAN BE DRIVEN BY A REAL GUEST
      # BEFORE IT IS PUBLISHED AS A RELEASE TAG - the same input easyvm-linux's fedora workflow
      # carries, for the same reason. The default does not change: `v0.0.4` is the release every
      # workflow in this repository pins.
      #
      # IT MATTERS MORE HERE THAN ANYWHERE ELSE. The engine defect fixed in easyvm 96ff5f2 was that
      # a `when:` on an ACTION step was never read - the dispatcher reached `input` before `when`.
      # These walks lean on that shape harder than any others: `answer a quit dialog` is an `input
      # esc` gated on `when [sure]`, and its whole job is to NOT press a key on a screen that is not
      # asking. MEASURED on windows10-install 45413503395 on v0.0.4: 791 rounds of
      # `clicked (1035, 620)` and `0.0000 similar`, with ZERO `applies:` or `skipped:` lines in the
      # log - the gate never ran once.
      image_tag:
        description: "the engine image tag (a release tag, `latest`, or a build sha)"
        default: "v0.0.4"

concurrency:
  group: windows11-install
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: ${{ inputs.image_tag }}
      disk_gb: "25"
      group: windows11-install
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "windows11-install",
            "file": "11/steps/install.walk",
            "pull": "",
            "assets": ["iso-windows11:windows.iso.tar", "iso-virtio-win:virtio-win.iso.tar", "answer-windows11:answer.iso.tar"],
            "out": "windows11.qcow2",
            "publish": "windows11",
            "timeout": 175
          }
        ]
