name: windows10-install

# WINDOWS 10 22H2: INSTALL ONTO A DISK THIS STAGE MAKES, AND PUBLISH IT.
#
# ONE FILE, ONE FAMILY, NO MATRIX. It references three tags by name and publishes one
# (`windows10`), so it runs alone and cannot be affected by another family's run.
#
# WHAT DIFFERS FROM 11/, AND WHY THIS FILE STILL EXISTS AS ITS OWN FILE:
#
#	the walk gates the quit dialog on `sure` instead of `quit`   Windows 10's Setup is reported to
#	                                                             read "...to exit?"; see 10/steps/install.walk
#	the answer CD is `answer-win10`                              a product key SELECTS an edition, and
#	                                                             this medium carries 11 images
#	NO TPM/Secure Boot bypasses                                  Windows 10 checks neither, so the block
#	                                                             is absent from the CD rather than empty
#	the budget is 150 minutes instead of 175                     no TPM or Secure Boot pages, no OOBE
#	                                                             account flow
#
# THE MEDIUM'S URL IS MINTED AT PUBLISH TIME, NOT WRITTEN HERE. Windows 10's connector answer is a
# signed link that expires in a day; artifacts-publish.yml resolves it in the job that downloads it,
# and this file only names the tag.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks and media"
        default: "easydev-org/easyvm-windows"
      # THE ENGINE THIS LEG RUNS INSIDE, OVERRIDABLE SO A FIX CAN BE DRIVEN BY A REAL GUEST
      # BEFORE IT IS PUBLISHED AS A RELEASE TAG - the same input easyvm-linux's fedora workflow
      # carries, for the same reason. The default does not change: `v0.0.4` is the release every
      # workflow in this repository pins.
      #
      # IT MATTERS MORE HERE THAN ANYWHERE ELSE. The engine defect fixed in easyvm 96ff5f2 was that
      # a `when:` on an ACTION step was never read - the dispatcher reached `input` before `when`.
      # These walks lean on that shape harder than any others: `answer a quit dialog` is an `input
      # esc` gated on `when [sure]`, and its whole job is to NOT press a key on a screen that is not
      # asking. MEASURED on windows10-install 45413503395 on v0.0.4: 791 rounds of
      # `clicked (1035, 620)` and `0.0000 similar`, with ZERO `applies:` or `skipped:` lines in the
      # log - the gate never ran once.
      image_tag:
        description: "the engine image tag (a release tag, `latest`, or a build sha)"
        default: "v0.0.4"

concurrency:
  group: windows10-install
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: ${{ inputs.image_tag }}
      disk_gb: "25"
      group: windows10-install
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "windows10-install",
            "file": "10/steps/install.walk",
            "pull": "",
            "assets": ["iso-win10:windows.iso.tar", "iso-virtio-win:virtio-win.iso.tar", "answer-win10:answer.iso.tar"],
            "out": "windows10.qcow2",
            "publish": "windows10",
            "timeout": 150
          }
        ]
