# WINDOWS: the same machine as Linux, plus two extra optical discs.
#
# THE MACHINE IS IDENTICAL. What differs is the MEDIA: Windows Setup finds neither its answer file nor
# its drivers on the install ISO, so two more discs are attached and the firmware boots the ISO as it
# would for any other guest.
#
# THE EXTRA DISCS NEED A USB CONTROLLER, AND THAT IS THE ONE ARGUMENT THIS SHAPE ADDS.
#
#	qemu-system-x86_64: -device qemu-xhci,id=xhci: Duplicate ID 'xhci' for device
#
# The daemon used to append an xHCI controller and a tablet at the end of its own argument list, and a
# Windows boot already had one for the answer and driver discs - qemu refuses rather than merging, so
# the machine never started and the failure arrived as
#
#	boot: qmp /work/drive.sock.qmp: connect: no such file or directory (waited 30s)
#
# which points at the socket rather than at the argument that killed qemu. The controller now comes
# from `Boot.StorageArgs` for every guest that needs optical media, and `ExtraArgs` carries nothing.

name: windows
description: "UEFI, virtio disk, VGA, plus the answer-file and driver CDs Setup reads"

firmware:
  kind: ovmf
  code: "{{.Code}}"
  vars: "{{.Vars}}"

cpu: {}

# `N,sockets=1,cores=N,threads=1` IS NOT WHAT WINDOWS NEEDS - it reads a bare count like Linux - so
# this stays plain and the topology form belongs to the one guest that requires it.
smp:
  format: plain

video:
  kind: vga

audio: hda
smc: false
install_medium: iso
extra_args: []

media:
  iso: true
  recovery: false
  # WINDOWS SETUP'S TWO EXTRA DISCS. Refused for every other guest, because a Linux installer given
  # an answer-file CD would find nothing on it and the mistake would surface as a wizard that never
  # advanced.
  answer_and_driver: true

# THE RAW QEMU COMMAND LINE. See `QEMUProfile` in internal/machine/shape.go.
#
# THE SAME MACHINE AS `linux.yaml`, EXCEPT FOR THE ADAPTER - a Windows guest is a q35 machine with a
# virtio disk, HDA audio and a usb-tablet, and the one line below is what makes it this guest.
#
# ONE PROFILE, because a Linux guest is started the same way whether it installs, boots an installed
# disk or runs a stage that only types.
qemu:
  default: q35

  profiles:
    q35:
      # `accel=kvm` MAKES A MISSING KVM LOUD rather than a guest at a fiftieth of the speed; `vmport=off`
      # disables q35's VMware backdoor port, whose `vmmouse` handler claims every absolute pointer
      # event and refuses it:
      #
      #	click (965, 981): pointer to (965, 981): Input handler not found for event type abs
      machine: "q35,accel=kvm,vmport=off"

      args:
        # THE AGENT'S PORT. `server=on,wait=off` so qemu starts without a client - the host connects
        # when it wants to ask something, and a guest with no host attached is normal.
        - ["-chardev", "socket,id=qga0,path={{work}}/qga.sock,server=on,wait=off"]
        - ["-device", "virtio-serial"]
        - ["-device", "virtserialport,chardev=qga0,name=org.qemu.guest_agent.0"]

        # THE SCREEN. `-device VGA` is the only form that carries a resolution, and `vgamem_mb=32` is
        # not tuning: the default 8 MiB cannot hold 1920x1080 at 32 bits, and the symptom is a black
        # screen from the first capture with no error at all.
        - ["-device", "VGA,xres=1920,yres=1080,vgamem_mb=32"]

        # THE USB CONTROLLER COMES FIRST, because every device below that names `bus=xhci.0` needs it
        # to exist: qemu resolves `bus=` as it parses, and `Bus 'xhci.0' not found` is an exit.
        #
        # THE POINTER AND THE KEYBOARD RIDE IT. A guest with no PS/2 - and every q35 guest is one -
        # has no pointer at all without this.
        - ["-device", "qemu-xhci,id=xhci"]
        - ["-device", "usb-tablet,bus=xhci.0"]
        - ["-device", "usb-kbd,bus=xhci.0"]

        # THE INSTALLER MEDIUM, when there is one. A pair whose `{{iso}}` is empty is dropped, so a
        # disk boot needs no conditional. The bootindex is what makes a fresh OVMF_VARS find it: an
        # implicit scan is the firmware's choice rather than a request, and measured it chose nothing.
        - ["-drive", "file={{iso}},media=cdrom,readonly=on,if=none,id=media0"]
        - ["-device", "ide-cd,drive=media0,bootindex=0"]

        # THE TWO EXTRA CDS WINDOWS SETUP READS, also dropped when absent. They are on USB because
        # q35's IDE controller has exactly one unit - `-device ide-cd,drive=media1,bootindex=1` is
        # "Can't create IDE unit 1, bus supports only 1 units".
        - ["-drive", "file={{answer}},media=cdrom,readonly=on,if=none,id=media1"]
        - ["-device", "usb-storage,bus=xhci.0,drive=media1"]
        - ["-drive", "file={{driver}},media=cdrom,readonly=on,if=none,id=media2"]
        - ["-device", "usb-storage,bus=xhci.0,drive=media2"]

        # THE TARGET DISK. `bootindex` is a DEVICE property, not a `-drive` one - it was put on the
        # drive first and qemu refused to start.
        - ["-drive", "file={{disk}},if=none,format=qcow2,id=target{{discard}}"]
        - ["-device", "virtio-blk-pci,drive=target,bootindex=1"]

        # THE SOUND CARD. `-audiodev` must precede the device that names it, or qemu fails with
        # `audiodev snd0 not found`. `hda-duplex` rather than `hda-output`: duplex carries line-out
        # AND line-in, so one codec gives the guest a speaker endpoint and a microphone endpoint.
        - ["-audiodev", "none,id=snd0"]
        - ["-device", "ich9-intel-hda"]
        - ["-device", "hda-duplex,audiodev=snd0"]

        # THE NETWORK. `romfile=` and `host_mtu=` are options every virtio-net-pci device has; the
        # mmio form a microvm needs has neither.
        - ["-netdev", "tap,id=net0,ifname=qemutap0,script=no,downscript=no"]
        - ["-device", "virtio-net-pci,netdev=net0,mac=52:54:00:56:4d:01,romfile=,host_mtu=1450"]
